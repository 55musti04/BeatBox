# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JVM arguments for the Gradle daemon.
# 2048m was not enough: the daemon died with a native OOM (hs_err_pid*.log)
# during R8 and KSP runs.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Kotlin compile daemon is a separate JVM and needs its own headroom.
kotlin.daemon.jvmargs=-Xmx2048m

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and not from the libraries it depends on,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# The legacy variant API is disabled by default in AGP 9. Keep the flag until the
# lint plugin stops touching applicationVariants/testVariants.
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# AGP 9 ships its own Kotlin support and registers a project level "kotlin"
# extension, which collides with the standalone Kotlin Gradle plugin that this
# project (and KSP) relies on.
android.builtInKotlin=false

# AGP 9 still allows relaxed R8 keep rules; the project relies on it for the
# Gson/Retrofit reflection-based models.
android.r8.strictFullModeForKeepRules=false

# The same package name is used for the unit test and instrumentation test
# source sets.
android.uniquePackageNames=false

# Dependency constraints are only needed for performance, not correctness.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
